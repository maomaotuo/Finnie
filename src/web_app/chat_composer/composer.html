<form class="composer">
  <textarea rows="1" aria-label="Ask Finnie a question" placeholder="Ask Finnie a question…"></textarea>
  <button type="button" class="microphone" aria-label="Record voice question" title="Record voice question">
    <svg class="mic-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
      <rect x="9" y="2" width="6" height="13" rx="3"/>
      <path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-3 0h6"/>
    </svg>
    <svg class="stop-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden>
      <rect x="6" y="6" width="12" height="12" rx="2"/>
    </svg>
  </button>
  <button class="send" type="submit" aria-label="Send question" title="Send question" disabled>
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 19V5m-6 6 6-6 6 6"/>
    </svg>
  </button>
</form>
<div class="status" role="status"></div>
